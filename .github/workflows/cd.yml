name: Production Deploy

# 组织 Secrets（与 qs-server / iam / qlume 共用）:
#   SVRB_SSH_KEY, SVRB_SUDO_PASSWORD
#   SVR_MINI_SSH_KEY（可选，Mac mini 部署优先使用）
# 组织 Variables:
#   SVRB_PUBLIC_HOST（推荐，大文件走公网）, SVRB_HOST, SVRB_USERNAME, SVRB_SSH_PORT
#   ALIYUN_ACR_REGISTRY, ALIYUN_ACR_NAMESPACE, ALIYUN_ACR_USERNAME, ALIYUN_ACR_PASSWORD
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# 仓库 Secrets:
#   REACT_APP_GRAFANA_URL（可选，build-arg；也可用 vars.REACT_APP_GRAFANA_URL）
#
# Deploy job 跑在 Mac mini self-hosted runners（替代原 ServerD）：
#   - 隔离 DOCKER_CONFIG，避免 macOS keychain 卡住 docker login
#   - 镜像上传优先走 SVRB_PUBLIC_HOST（Tailscale DERP 太慢）

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qs-operating-system-production-deploy
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_REPOSITORY: fangcunmount
  SERVICE: ops
  DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
  DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  DEPLOY_EXPORT_REGISTRY: ${{ vars.QS_DEPLOY_EXPORT_REGISTRY || 'acr' }}

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment:
      name: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
      ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
      REACT_APP_GRAFANA_URL: ${{ vars.REACT_APP_GRAFANA_URL != '' && vars.REACT_APP_GRAFANA_URL || secrets.REACT_APP_GRAFANA_URL }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and publish image
        run: |
          make cd-image \
            SERVICE="${SERVICE}" \
            DEPLOY_REF="${DEPLOY_REF}" \
            DEPLOY_SHA="${DEPLOY_SHA}" \
            REACT_APP_GRAFANA_URL="${REACT_APP_GRAFANA_URL}"

  deploy:
    name: Deploy to ServerB
    needs: [docker]
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment:
      name: production
    if: |
      always() &&
      needs.docker.result == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Login ACR (isolated config, no keychain)
        if: env.DEPLOY_EXPORT_REGISTRY == 'acr'
        shell: bash
        env:
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -Eeuo pipefail
          # macOS 上 docker login 会默认走 osxkeychain，无 GUI 会话失败 (-25308)。
          # 不跑 docker login，直接把 auth 写进隔离配置。
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "${DOCKER_CONFIG_DIR}"
          AUTH="$(printf '%s:%s' "${ALIYUN_ACR_USERNAME}" "${ALIYUN_ACR_PASSWORD}" | base64 | tr -d '\n')"
          umask 077
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "${ALIYUN_ACR_REGISTRY}" "${AUTH}" \
            > "${DOCKER_CONFIG_DIR}/config.json"
          echo "DOCKER_CONFIG=${DOCKER_CONFIG_DIR}" >> "${GITHUB_ENV}"

      - name: Export deployment image tarball
        if: env.DEPLOY_EXPORT_REGISTRY == 'acr'
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          EXPORT_IMAGE_REGISTRY: acr
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: make cd-export-image SERVICE="${SERVICE}"

      - name: Setup deploy SSH
        env:
          RUNNER_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRB_SSH_KEY }}
          # 大文件走公网：Tailscale DERP 中继太慢；打洞成功前优先公网
          RUNNER_SSH_HOST: ${{ vars.SVRB_PUBLIC_HOST || secrets.SVRB_PUBLIC_HOST || vars.SVRB_HOST || secrets.SVRB_HOST }}
          RUNNER_SSH_USER: ${{ vars.SVRB_USERNAME || secrets.SVRB_USERNAME }}
          RUNNER_SSH_PORT: ${{ vars.SVRB_SSH_PORT || secrets.SVRB_SSH_PORT || 22 }}
          RUNNER_SSH_ALIAS: deploy-target
        run: bash scripts/cd/setup-runner-ssh.sh

      - name: Upload and deploy
        env:
          RUNNER_SSH_ALIAS: deploy-target
          SERVICE: ${{ env.SERVICE }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          DOCKER_REGISTRY: ${{ env.DOCKER_REGISTRY }}
          DOCKER_REPOSITORY: ${{ env.DOCKER_REPOSITORY }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          SUDO_PASSWORD: ${{ secrets.SVRB_SUDO_PASSWORD }}
        run: bash scripts/cd/runner-upload-and-deploy.sh

      - name: Cleanup runner artifacts
        if: always()
        shell: bash
        run: |
          rm -f deploy-image-ops.tar.gz
          rm -f "${RUNNER_SSH_KEY_FILE:-}" 2>/dev/null || true
          rm -rf "${DOCKER_CONFIG:-}" 2>/dev/null || true
          docker image prune -f >/dev/null 2>&1 || true

  notify:
    name: Deployment Summary
    needs: [docker, deploy]
    runs-on: ubuntu-latest
    if: |
      always() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         (github.event.workflow_run.head_branch == 'main' ||
          github.event.workflow_run.head_branch == 'master'))
      )
    steps:
      - name: Log deployment status
        run: |
          echo "=========================================="
          echo "Deployment Summary"
          echo "=========================================="
          echo "Docker: ${{ needs.docker.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          echo "Ref: ${DEPLOY_REF}"
          echo "SHA: ${DEPLOY_SHA}"
          echo "Service: ${SERVICE}"
          if [ "${{ needs.docker.result }}" != "success" ] || [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "Production deploy failed or was skipped."
            exit 1
          fi
          echo "Production deploy completed."
