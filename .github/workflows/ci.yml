name: CI/CD Pipeline

# ============================================================================
# 必需的 Secrets 配置
# ============================================================================
# Organization Secrets (组织级别，共享配置):
#   ServerB: SVRB_HOST, SVRB_USERNAME, SVRB_SSH_KEY, SVRB_SSH_PORT
#   SVRB_SUDO_PASSWORD (可选，如果 sudo 需要密码)
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (可选，如果使用 Docker Hub)
#   注意：根据架构文档，前端只部署到 ServerB，不需要 ServerA 的配置
#
# Repository Secrets (仓库级别，敏感信息):
#   WWW_UID, WWW_GID (可选，默认 1000/1000)
#   DEPLOY_PATH_SERVERB (可选，默认 /opt/qs-ops)
#   注意：根据架构文档，前端只部署到 ServerB，不部署到 ServerA
# ============================================================================

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      deploy:
        description: "是否部署到 ServerB（只允许 main 分支）"
        required: false
        type: boolean
        default: false

# 关键：推 GHCR 需要 packages: write
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/fangcunmount/qs-operating-system
  IMAGE_DOCKERHUB: fangcunmount/qs-operating-system
  DOCKERFILE: build/Dockerfile

jobs:
  validate-secrets:
    name: Validate Secrets
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check required secrets
        shell: bash
        env:
          SVRB_HOST: ${{ secrets.SVRB_HOST }}
          SVRB_USERNAME: ${{ secrets.SVRB_USERNAME }}
          SVRB_SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
          SVRB_SSH_PORT: ${{ secrets.SVRB_SSH_PORT }}
          SVRB_SUDO_PASSWORD: ${{ secrets.SVRB_SUDO_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          ENFORCE_REQUIRED=0
          VALIDATION_FAILED=0

          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            ENFORCE_REQUIRED=1
            echo "📋 main/master 分支：严格校验部署必需 secrets"
          else
            echo "ℹ️ 非 main/master 分支：仅提示缺失，不阻断"
          fi

          REQUIRED_SECRETS=(SVRB_HOST SVRB_USERNAME SVRB_SSH_KEY)
          OPTIONAL_SECRETS=(SVRB_SSH_PORT SVRB_SUDO_PASSWORD GHCR_TOKEN GHCR_USERNAME DOCKERHUB_USERNAME DOCKERHUB_TOKEN)

          for SECRET_NAME in "${REQUIRED_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "✅ $SECRET_NAME is set"
            else
              if [ "$ENFORCE_REQUIRED" -eq 1 ]; then
                echo "❌ $SECRET_NAME is not set"
                VALIDATION_FAILED=1
              else
                echo "⚠️ $SECRET_NAME is not set (required on main/master deploy)"
              fi
            fi
          done

          echo "📎 optional secrets check..."
          for SECRET_NAME in "${OPTIONAL_SECRETS[@]}"; do
            VALUE="${!SECRET_NAME:-}"
            if [ -n "$VALUE" ]; then
              echo "✅ $SECRET_NAME is set"
            else
              case "$SECRET_NAME" in
                GHCR_TOKEN)
                  if [ "$ENFORCE_REQUIRED" -eq 1 ]; then
                    echo "⚠️ $SECRET_NAME is not set — 部署将改用 Actions 内置 GITHUB_TOKEN 登录 GHCR（须在 Package 设置中给本仓库 Actions 读权限）"
                  else
                    echo "⚠️ $SECRET_NAME is not set (optional; Actions token may be used instead)"
                  fi
                  ;;
                DOCKERHUB_TOKEN|DOCKERHUB_USERNAME)
                  echo "⚠️ $SECRET_NAME is not set — GHCR 失败时无法回退 Docker Hub"
                  ;;
                *)
                  echo "⚠️ $SECRET_NAME is not set (optional)"
                  ;;
              esac
            fi
          done

          if [ "$ENFORCE_REQUIRED" -eq 1 ] && [ "$VALIDATION_FAILED" -eq 1 ]; then
            echo "❌ Secrets validation failed."
            exit 1
          fi
          echo "✅ Secrets validation passed."

  test_lint:
    needs: [validate-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: "npm"

      - run: npm ci

      - name: Test
        run: npm test -- --coverage --watchAll=false --passWithNoTests || true

      - name: Lint
        run: npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0 || true

  docker_build_push:
    needs: [test_lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror image to Docker Hub (optional)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "ℹ️ Docker Hub credentials missing, skip mirror."
            exit 0
          fi
          if ! echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin; then
            echo "⚠️ Docker Hub login failed, skip mirror."
            exit 0
          fi
          if ! docker buildx imagetools create -t "${IMAGE_DOCKERHUB}:latest" "${IMAGE}:latest"; then
            echo "⚠️ Mirror latest tag failed, skip Docker Hub mirror."
            exit 0
          fi
          if ! docker buildx imagetools create -t "${IMAGE_DOCKERHUB}:sha-${GITHUB_SHA}" "${IMAGE}:sha-${GITHUB_SHA}"; then
            echo "⚠️ Mirror sha tag failed, keep GHCR as source of truth."
            exit 0
          fi

  deploy_serverb:
    needs: [docker_build_push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == true)
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SVRB_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 去掉 Windows CRLF，避免 key 解析失败
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -lf ~/.ssh/id_ed25519

      - name: Deploy to ServerB
        shell: bash
        env:
          HOST: ${{ secrets.SVRB_HOST }}
          USER: ${{ secrets.SVRB_USERNAME }}
          PORT: ${{ secrets.SVRB_SSH_PORT || 22 }}
          SUDO_PASSWORD: ${{ secrets.SVRB_SUDO_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_ACTIONS_USER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
          ACTIONS_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_DOCKERHUB: ${{ env.IMAGE_DOCKERHUB }}
        run: |
          set -Eeuo pipefail

          SSH_OPTS="-i ~/.ssh/id_ed25519 -p ${PORT} -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          echo "🔌 Connecting to ${USER}@${HOST}:${PORT}"

          cat <<'REMOTE_SCRIPT' | ssh ${SSH_OPTS} "${USER}@${HOST}" "IMAGE=${IMAGE} IMAGE_DOCKERHUB=${IMAGE_DOCKERHUB} SUDO_PASSWORD='${SUDO_PASSWORD}' GHCR_USERNAME='${GHCR_USERNAME}' GHCR_TOKEN='${GHCR_TOKEN}' GHCR_ACTIONS_USER='${GHCR_ACTIONS_USER}' GHCR_ACTOR='${GHCR_ACTOR}' ACTIONS_GITHUB_TOKEN='${ACTIONS_GITHUB_TOKEN}' DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}' DOCKERHUB_TOKEN='${DOCKERHUB_TOKEN}' bash -s"
          set -Eeuo pipefail

          CONTAINER_NAME="qs-operating-system"
          NETWORK_NAME="infra-network"
          IMAGE_NAME="${IMAGE}:latest"
          IMAGE_NAME_DOCKERHUB="${IMAGE_DOCKERHUB}:latest"
          REGISTRY="ghcr.io"
          APP_PORT="3000"
          HEALTH_URL="http://127.0.0.1:${APP_PORT}/"
          PREV_IMAGE=""

          # sudo helper（兼容需要密码/不需要密码）
          if sudo -n true 2>/dev/null; then
            SUDO="sudo"
          else
            if [ -z "${SUDO_PASSWORD:-}" ]; then
              echo "❌ sudo 需要密码，但没有配置 SVRB_SUDO_PASSWORD" >&2
              exit 1
            fi
            sudo_pw() { sudo -S "$@" <<<"$SUDO_PASSWORD"; }
            export -f sudo_pw
            SUDO="sudo_pw"
            $SUDO -v || true
          fi

          USE_IMAGE="${IMAGE_NAME}"
          GHCR_PULL_OK=0

          ghcr_try_login_pull() {
            local user="$1"
            local secret="$2"
            local label="$3"
            [ -n "$secret" ] || return 1
            echo "🔐 GHCR (${label}) login as ${user}..."
            $SUDO docker logout "${REGISTRY}" 2>/dev/null || true
            if ! printf '%s' "$secret" | $SUDO docker login "${REGISTRY}" -u "$user" --password-stdin; then
              echo "⚠️ GHCR login failed (${label})" >&2
              return 1
            fi
            echo "📥 Pull from GHCR: ${IMAGE_NAME}"
            if ! $SUDO docker pull "${IMAGE_NAME}"; then
              echo "⚠️ GHCR pull failed (${label})" >&2
              return 1
            fi
            return 0
          }

          if [ -n "${GHCR_TOKEN:-}" ]; then
            for u in "${GHCR_USERNAME}" "$(printf '%s' "${GHCR_USERNAME}" | tr '[:upper:]' '[:lower:]')"; do
              [ -n "$u" ] || continue
              if ghcr_try_login_pull "$u" "${GHCR_TOKEN}" "PAT"; then
                GHCR_PULL_OK=1
                break
              fi
            done
          fi

          if [ "${GHCR_PULL_OK}" -ne 1 ] && [ -n "${ACTIONS_GITHUB_TOKEN:-}" ]; then
            echo "⚠️ PAT 无效或未配置，尝试 Actions GITHUB_TOKEN（依次：owner / owner小写 / actor / actor小写）"
            for u in \
              "${GHCR_ACTIONS_USER:-}" \
              "$(printf '%s' "${GHCR_ACTIONS_USER:-}" | tr '[:upper:]' '[:lower:]')" \
              "${GHCR_ACTOR:-}" \
              "$(printf '%s' "${GHCR_ACTOR:-}" | tr '[:upper:]' '[:lower:]')"; \
            do
              [ -n "$u" ] || continue
              if ghcr_try_login_pull "$u" "${ACTIONS_GITHUB_TOKEN}" "GITHUB_TOKEN"; then
                GHCR_PULL_OK=1
                break
              fi
            done
          fi

          if [ "${GHCR_PULL_OK}" -ne 1 ]; then
            if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              echo "⚠️ GHCR 不可用，回退 Docker Hub"
              $SUDO docker logout "${REGISTRY}" 2>/dev/null || true
              if ! printf '%s' "${DOCKERHUB_TOKEN}" | $SUDO docker login -u "${DOCKERHUB_USERNAME}" --password-stdin; then
                echo "❌ Docker Hub 登录失败：检查 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（建议用 Hub Access Token，勿用账户密码）" >&2
                exit 1
              fi
              echo "📥 Pull from Docker Hub: ${IMAGE_NAME_DOCKERHUB}"
              if ! $SUDO docker pull "${IMAGE_NAME_DOCKERHUB}"; then
                echo "❌ Docker Hub pull 失败" >&2
                exit 1
              fi
              USE_IMAGE="${IMAGE_NAME_DOCKERHUB}"
            else
              echo "❌ GHCR 全部方式失败，且无 Docker Hub 兜底。" >&2
              echo "   排查：① ghcr.io 上该 Package → Package settings → Manage Actions access：给本仓库 Read/Write；" >&2
              echo "   ② 组织若启用 SSO：PAT 须在 SSO 中 Authorize；③ docker login 用户名需与镜像命名空间一致（多已用小写 org 名）；④ PAT 勾选 read:packages（私有再加 repo）。" >&2
              echo "   ⑤ 仍 denied 时在服务器手动验证：printf '%s' \"\$TOKEN\" | docker login ghcr.io -u \"fangcunmount\" --password-stdin" >&2
              exit 1
            fi
          fi

          # 网络不存在就创建（比直接失败更“改完就能跑”）
          if ! $SUDO docker network ls --format '{{.Name}}' | grep -q "^${NETWORK_NAME}$"; then
            echo "ℹ️ Network ${NETWORK_NAME} not found, creating..."
            $SUDO docker network create "${NETWORK_NAME}"
          fi

          # 记录当前运行版本，供失败回滚
          if $SUDO docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            PREV_IMAGE="$($SUDO docker inspect --format '{{.Config.Image}}' "${CONTAINER_NAME}" 2>/dev/null || true)"
            if [ -n "${PREV_IMAGE}" ]; then
              echo "🧾 Previous image detected: ${PREV_IMAGE}"
            fi
          fi

          if $SUDO docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            $SUDO docker stop "${CONTAINER_NAME}" || true
            $SUDO docker rm "${CONTAINER_NAME}" || true
          fi

          echo "🚀 Run container: ${CONTAINER_NAME}"
          $SUDO docker run -d \
            --name "${CONTAINER_NAME}" \
            --network "${NETWORK_NAME}" \
            --restart unless-stopped \
            -p ${APP_PORT}:${APP_PORT} \
            "${USE_IMAGE}"

          echo "🩺 Health check: ${HEALTH_URL}"
          HEALTH_OK=0
          for i in $(seq 1 20); do
            if $SUDO curl -fsS --max-time 3 "${HEALTH_URL}" >/dev/null 2>&1; then
              HEALTH_OK=1
              break
            fi
            sleep 3
          done

          if [ "${HEALTH_OK}" -ne 1 ]; then
            echo "❌ Health check failed, start rollback..."
            $SUDO docker logs --tail 100 "${CONTAINER_NAME}" || true
            $SUDO docker stop "${CONTAINER_NAME}" || true
            $SUDO docker rm "${CONTAINER_NAME}" || true

            if [ -n "${PREV_IMAGE}" ]; then
              echo "↩️ Rollback to previous image: ${PREV_IMAGE}"
              $SUDO docker run -d \
                --name "${CONTAINER_NAME}" \
                --network "${NETWORK_NAME}" \
                --restart unless-stopped \
                -p ${APP_PORT}:${APP_PORT} \
                "${PREV_IMAGE}"
              echo "⚠️ Deployment rolled back."
              $SUDO docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
            else
              echo "❌ No previous image available, rollback skipped." >&2
            fi
            exit 1
          fi

          echo "✅ Done. Current status:"
          $SUDO docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}\t{{.Image}}"
          REMOTE_SCRIPT
