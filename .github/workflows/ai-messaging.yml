name: AI messaging UI isolated
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-mq-operations]
permissions:
  contents: read
jobs:
  messaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: npm
      - run: npm ci
      - name: Verify required MQ UI scenarios
        run: |
          mkdir -p artifacts
          CI=true npm test -- --watchAll=false --runInBand src/pages/operations/ai-governance/workspaces/native src/pages/operations/ai-governance/workspaces/runtime/RuntimeWorkspace.test.tsx src/api/path/aiWorkflow src/api/qsServer.noReplay.test.ts --json --outputFile=artifacts/mq-ui.json
          python3 scripts/ci/verify_mq_report.py artifacts/mq-ui.json
      - run: npx tsc --noEmit --pretty false
      - run: npx eslint . --ext .ts,.tsx,.js,.jsx --max-warnings 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-mq-ui
          path: artifacts/
          if-no-files-found: error
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          build-args: |
            REACT_APP_BUILD_SHA=${{ github.sha }}
            REACT_APP_BUILD_REF=${{ github.ref_name }}
          load: true
          tags: qs-ops:mq-ci
      - name: Check standard static image without publishing
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node qs-ops:mq-ci -e 'const fs=require("fs"); if(process.getuid()===0 || !fs.existsSync("dist/index.html")) process.exit(1)'
          docker image inspect qs-ops:mq-ci > mq-image.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-mq-ui-image
          path: mq-image.json
          if-no-files-found: error
